name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Node et pnpm aux versions de package.json, comme le Dockerfile.
      - id: versions
        run: |
          echo "node=$(jq -r .devEngines.runtime.version package.json)" >> "$GITHUB_OUTPUT"
          echo "pnpm=$(jq -r .packageManager package.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.versions.outputs.node }}
      - run: npm install -g "${{ steps.versions.outputs.pnpm }}"
      # Les tests d'extraction PDF lancent pdftotext.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build .
